<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre arrondi (style App) -->
  <rect width="100" height="100" rx="26" fill="#0A0A0A" />

  <!-- Anneau (Arrière-plan) -->
  <ellipse cx="50" cy="52" rx="40" ry="16" stroke="url(#g)" stroke-width="6" transform="rotate(-30 50 52)" />

  <!-- Lettre A -->
  <text x="50" y="52" dominant-baseline="central" text-anchor="middle" fill="#FFFFFF" font-size="56" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-3">A</text>

  <!-- Anneau (Avant-plan - pour l'effet 3D) -->
  <g clip-path="url(#clip)">
    <ellipse cx="50" cy="52" rx="40" ry="16" stroke="url(#g)" stroke-width="6" transform="rotate(-30 50 52)" />
  </g>

  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="52" width="100" height="48" />
    </clipPath>
  </defs>
</svg>